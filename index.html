<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://upwzdctedpazranppskz.supabase.co">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2e9cab">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="BambuCalc">
    <link rel="apple-touch-icon" href="/icons/icon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- title, description, robots, canonical, og:title/description/url, twitter:title/description
         sont gérés par useHead() dans chaque composant de page (évite les doublons CSR) -->
    <meta property="og:type"   content="website">
    <meta property="og:locale" content="fr_FR">
    <meta name="twitter:card"  content="summary_large_image">

    <!-- Preload images LCP — visibles dans le document initial dès le HTML -->
    <link rel="preload" as="image" href="/bambuLab%20Filament.webp" fetchpriority="high">
    <link rel="preload" as="image" href="/assets/svg/maintenance/maintenance.svg" fetchpriority="high">
    <link rel="preload" as="image" href="/assets/svg/shared/hero-vagues.svg" fetchpriority="high">

    <!-- Données structurées JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "BambuCalc",
      "url": "https://bambucalc.netlify.app",
      "description": "Calculateur de coût d'impression 3D gratuit. Estimez vos prix de revient, créez des devis PDF professionnels et suivez vos projets.",
      "applicationCategory": "UtilityApplication",
      "operatingSystem": "Web",
      "inLanguage": "fr",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "EUR"
      },
      "creator": {
        "@type": "Person",
        "name": "Fanny Saez",
        "url": "https://www.linkedin.com/in/fannysaez/"
      }
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
