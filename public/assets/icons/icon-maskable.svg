<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb2bf"/>
      <stop offset="100%" stop-color="#1a8a96"/>
    </linearGradient>
  </defs>

  <!-- Fond plein (maskable : le fond doit couvrir entièrement) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Cube réduit dans la safe zone (80 % centré = ±204 px du centre) -->
  <!-- Face du dessus -->
  <polygon points="256,148 352,196 256,244 160,196" fill="rgba(255,255,255,0.95)"/>
  <!-- Face gauche -->
  <polygon points="160,196 256,244 256,340 160,292" fill="rgba(255,255,255,0.60)"/>
  <!-- Face droite -->
  <polygon points="352,196 256,244 256,340 352,292" fill="rgba(255,255,255,0.80)"/>

  <!-- Filament -->
  <line x1="256" y1="340" x2="256" y2="380" stroke="rgba(255,255,255,0.7)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="390" r="10" fill="rgba(255,255,255,0.7)"/>
</svg>
