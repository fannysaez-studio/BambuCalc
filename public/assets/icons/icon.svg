<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb2bf"/>
      <stop offset="100%" stop-color="#1a8a96"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Cube 3D stylisé — face du dessus -->
  <polygon points="256,108 378,172 256,236 134,172" fill="rgba(255,255,255,0.95)"/>
  <!-- Face gauche -->
  <polygon points="134,172 256,236 256,364 134,300" fill="rgba(255,255,255,0.60)"/>
  <!-- Face droite -->
  <polygon points="378,172 256,236 256,364 378,300" fill="rgba(255,255,255,0.80)"/>

  <!-- Ligne de filament — trait diagonal animé -->
  <line x1="256" y1="364" x2="256" y2="420" stroke="rgba(255,255,255,0.7)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="430" r="10" fill="rgba(255,255,255,0.7)"/>
</svg>
